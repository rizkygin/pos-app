services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is inlined at build time as the BROWSER-facing URL
        # (localhost:4000 = the backend's published host port). Server-side RSC /
        # middleware fetches use API_URL_INTERNAL at runtime instead (see below).
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
        - BETTER_AUTH_URL=${BETTER_AUTH_URL}
        - RESEND_API_KEY=${RESEND_API_KEY}
    container_name: pos-frontend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Override PORT=4000 from .env (that's the backend's port) — the standalone
      # frontend server reads process.env.PORT and must listen on 3000.
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Server-side fetches (RSC + proxy.ts middleware) reach the backend over the
      # compose network, since the browser-facing localhost:4000 won't resolve
      # inside this container. The frontend no longer needs DATABASE_URL.
      - API_URL_INTERNAL=http://backend:4000
    ports:
      # Standalone server listens on 3000 (Dockerfile EXPOSE 3000).
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: pos-backend
    env_file:
      - .env
    environment:
      # Override the host-oriented DATABASE_URL/PORT from .env so the container
      # reaches Postgres over the compose network instead of localhost.
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      - PORT=4000
      # Local-only: the prod build runs over plain HTTP on localhost, so issue a
      # host-only, non-secure session cookie (else browsers drop the Secure /
      # .ulunpesan.com cookie and login never persists). Omit both in real deploy.
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist user uploads (products/ads/avatars) across container restarts.
      - backend-uploads:/app/uploads
    healthcheck:
      # Use 127.0.0.1, not localhost: the server binds IPv4 only, and busybox
      # wget resolves localhost to IPv6 (::1) first -> false "unhealthy".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:latest
    container_name: pos-app
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-pos-app
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
